# ============================================================================
# Quackback — production stack (self-hosting)
# ============================================================================
# A self-contained, single-host deployment: the Quackback app plus its
# datastores (PostgreSQL + Dragonfly + MinIO). Unlike the dev docker-compose.yml,
# this file is safe to run on a server:
#   - the app is the ONLY service with a published host port
#   - datastores are reachable only on the internal compose network
#   - every secret is required via ${VAR:?...} — the stack refuses to start
#     half-configured instead of falling back to insecure defaults
#   - the upload bucket is PRIVATE (served through the app at /api/storage)
#
# Quick start:
#   git clone https://github.com/QuackbackIO/quackback.git && cd quackback
#   cp .env.prod.example .env      # then fill in every value
#   docker compose -f docker-compose.prod.yml up -d
#
# Migrations run automatically on app startup. Upgrade with:
#   git pull && docker compose -f docker-compose.prod.yml pull && \
#     docker compose -f docker-compose.prod.yml up -d
# (back up your database first — see the self-hosting docs).
#
# For an external Postgres / Redis / S3 instead of the bundled datastores,
# point the URLs at your managed services and remove the services you no longer
# need. To scale beyond one host, use managed datastores + the `docker run`
# path; this compose is single-node by design.
# ============================================================================

services:
  app:
    # ⭐ DIAFANE : L'IMAGE SE CONSTRUIT DEPUIS CE DEPOT, elle ne se tire plus de
    # `ghcr.io/quackbackio/quackback`.
    #
    # POURQUOI, ET CE QUE CA A COUTE DE L'APPRENDRE (2026-09-23) : tant que
    # cette ligne disait `image:`, le code venant du registre de l'editeur,
    # AUCUN correctif de ce fork ne pouvait atteindre le portail. Deux
    # demandes de fusion ont ete ecrites, relues et fusionnees sans avoir la
    # moindre chance de s'appliquer, et leur absence a d'abord ete prise pour
    # un deploiement rate. Le depot n'etait lu que pour CE fichier.
    #
    # Ce que ca change : chaque deploiement devient une vraie compilation
    # (`bun install` puis le build de `apps/web`), sur un VPS partage avec cinq
    # autres projets dont le disque s'est deja rempli une fois. C'est le prix
    # accepte par Seb pour que le fork veuille dire quelque chose.
    #
    # ⚠️ PAS DE CLE `image:` A COTE DE `build:` : un `docker compose pull`
    # irait alors chercher l'image de l'editeur et pourrait la servir a la
    # place de la notre, ce qui ramenerait exactement le defaut ci-dessus,
    # cette fois en silence. `QUACKBACK_TAG` ne sert donc plus a rien.
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: quackback-app
    restart: unless-stopped
    init: true
    # Carries BASE_URL, SECRET_KEY, email settings, and the whole S3 setting
    # (S3_ENDPOINT, S3_REGION, S3_BUCKET, S3_ACCESS_KEY_ID, S3_SECRET_ACCESS_KEY).
    env_file: .env
    # Internal wiring is fixed here (derived from the secrets in .env) so a
    # self-hoster can't point these at the wrong host — these override env_file.
    #
    # ⭐ DIAFANE : LES FICHIERS VIVENT CHEZ SCALEWAY, PLUS DANS UN MINIO LOCAL
    # (2026-09-28). MinIO n'est plus distribue : images retirees de Docker Hub
    # puis de quay.io, binaires retires (410), code source archive. L'image du
    # serveur n'existait plus que dans le cache du VPS. Les services `minio` et
    # `minio-init` sont donc partis, et le stockage se regle ENTIEREMENT par les
    # variables de Coolify (env_file ci-dessus). Si l'une manque, le portail
    # demarre quand meme : seuls les envois et l'affichage des fichiers
    # echouent (`getS3Config`), ce qui vaut mieux qu'un portail arrete.
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:?set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-quackback}
      REDIS_URL: redis://dragonfly:6379
      S3_FORCE_PATH_STYLE: 'true'
      # Les fichiers passent par le proxy /api/storage de l'application : le
      # navigateur ne parle jamais au stockage, le compartiment reste prive.
      S3_PROXY: 'true'
    ports:
      - '${APP_PORT:-3000}:3000'
    depends_on:
      postgres:
        condition: service_healthy
      dragonfly:
        condition: service_healthy
    healthcheck:
      # Use Bun (always in the image) so we don't depend on curl/wget. The
      # container listens on 3000 regardless of the published APP_PORT.
      test:
        [
          'CMD',
          'bun',
          '-e',
          "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  postgres:
    build:
      context: ./docker/postgres
      dockerfile: Dockerfile
    container_name: quackback-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-quackback}
    # No host port — Postgres is reachable only on the internal network.
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./docker/postgres/init-pgcron.sql:/docker-entrypoint-initdb.d/init-pgcron.sql
    # pg_cron is required for scheduled analytics/materialized-view refreshes.
    command: postgres -c shared_preload_libraries=pg_cron -c cron.database_name=${POSTGRES_DB:-quackback} -c max_connections=200
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 5

  dragonfly:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:v1.27.1
    container_name: quackback-dragonfly
    restart: unless-stopped
    # BullMQ requires cluster_mode=emulated + lock_on_hashtags for Lua script compatibility.
    command: dragonfly --cluster_mode=emulated --lock_on_hashtags
    # No host port — reachable only on the internal network.
    volumes:
      - dragonfly_data:/data
    ulimits:
      memlock: -1
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  # ⭐ DIAFANE : LA SAUVEGARDE DE LA BASE (2026-10-07). Chaque nuit, une copie
  # de la base part, chiffree par restic, dans un compartiment Scaleway a part ;
  # chaque lundi, la derniere copie est restauree dans une base d'essai pour
  # prouver qu'elle se relit. Le fonctionnement est en tete de
  # docker/sauvegarde/sauvegarder.sh, la sauvegarde a la main aussi
  # (`sauvegarder maintenant <etiquette>` dans le terminal de ce conteneur).
  #
  # ⚠️ AUCUNE VARIABLE EN `${VAR:?}` DANS CE SERVICE : une variable manquante y
  # ferait refuser le demarrage de TOUTE la pile, portail compris. Le script
  # dit lui-meme ce qui manque, dans son journal et sur Telegram.
  #
  # ⚠️ PAS D'`env_file` NON PLUS : le service ne recoit que ce qui suit. Les
  # noms `SAUVEGARDE_*` de Coolify deviennent ici les noms qu'attend restic.
  # Poses tels quels dans Coolify (`AWS_ACCESS_KEY_ID`...), ils arriveraient
  # aussi dans l'application par son `env_file`, sous les noms que la chaine
  # d'identifiants par defaut du SDK AWS lit d'elle-meme : aujourd'hui le
  # stockage passe ses propres identifiants, mais un module qui ne le ferait
  # pas ecrirait avec la cle des sauvegardes.
  #
  # L'application ne depend PAS de ce service : s'il ne demarre pas, le portail
  # demarre quand meme.
  sauvegarde:
    build:
      context: ./docker/sauvegarde
      dockerfile: Dockerfile
    container_name: quackback-sauvegarde
    restart: unless-stopped
    init: true
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-quackback}
      PGPASSWORD: ${POSTGRES_PASSWORD:-}
      PGDATABASE: ${POSTGRES_DB:-quackback}
      RESTIC_REPOSITORY: ${SAUVEGARDE_DEPOT:-s3:s3.fr-par.scw.cloud/diafane-feedback-sauvegardes/base}
      RESTIC_PASSWORD: ${SAUVEGARDE_MOT_DE_PASSE:-}
      AWS_ACCESS_KEY_ID: ${SAUVEGARDE_CLE_ID:-}
      AWS_SECRET_ACCESS_KEY: ${SAUVEGARDE_CLE_SECRETE:-}
      AWS_DEFAULT_REGION: fr-par
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      SAUVEGARDE_HEURE: ${SAUVEGARDE_HEURE:-02:30}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  # L'ancien stockage MinIO, garde tel quel depuis le passage a Scaleway
  # (2026-09-28) : plus aucun service ne le monte. Le retirer d'ici ne
  # supprimerait pas les donnees, mais on ne le fait qu'une fois verifie que
  # rien n'y manque au nouveau stockage.
  minio_data:
  dragonfly_data:
